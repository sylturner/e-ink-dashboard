development: &defaults
  fetch_sources:
    class: FetchDueSourcesJob
    schedule: every minute
  render_all:
    class: RenderAllDevicesJob
    schedule: every 30 minutes

production:
  <<: *defaults

  # Kept from the Rails default schedule; the Phase 3 doc's recurring.yml
  # omits it, which would let finished jobs accumulate indefinitely.
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
