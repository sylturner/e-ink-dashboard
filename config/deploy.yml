service: eink-dashboard
image: syl/eink-dashboard

servers:
  web:
    - nastier.local

# If 4567 is your SSH port, uncomment this and remove proxy.run below.
# ssh:
#   port: 4567
ssh:
  user: syl

proxy:
  ssl: false
  # Route everything rather than matching a host, so both
  # nastier.local:4567 and the raw IP work.
  app_port: 3000
  healthcheck:
    path: /up
    interval: 5
    timeout: 60
  run:
    # The NAS web UI owns 80/443, so publish the proxy elsewhere.
    http_port: 4567

registry:
  server: localhost:5555

builder:
  arch: amd64

env:
  clear:
    # Rails resolves relative time against this; the panel shows clocks.
    TZ: America/New_York
    RAILS_LOG_LEVEL: info
    # Runs Solid Queue inside Puma. One container instead of two, which
    # is the right trade for a single-app home deployment.
    SOLID_QUEUE_IN_PUMA: true
    # Chromium lives in the image; point Ferrum at it.
    CHROME_PATH: /usr/bin/chromium
    WEB_CONCURRENCY: 1
  secret:
    - RAILS_MASTER_KEY

volumes:
  # SQLite databases, Active Record encryption keys' target data, and
  # rendered frames all live here. Without this, every deploy wipes
  # your dashboards.
  - "eink_storage:/rails/storage"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  logs: app logs -f
  shell: app exec --interactive --reuse "bash"
  token: app exec --reuse "bin/rails runner 'puts Device.first.token'"

retain_containers: 2
