<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Installed as /etc/fonts/local.conf in the Docker image.

  Linux Chromium ignores -webkit-font-smoothing and takes antialiasing from
  fontconfig instead. With it on, text in a grid column at a fractional x
  is drawn half a pixel off in gray, and the 1-bit conversion rounds each
  stroke a different way, so letters come out distorted. Aliased, every
  glyph snaps to whole pixels, as it does in Chrome on macOS.
-->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
