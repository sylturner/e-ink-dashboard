# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  activerecord:
    attributes:
      app_setting:
        server_url: "Server address"
    errors:
      models:
        app_setting:
          attributes:
            server_url:
              not_an_address: "must be a scheme, host and port, like http://192.168.1.10:3000"
  app:
    name: "E Ink Dashboard"
    # Shown in place of the name when the sidebar is narrowed.
    short_name: "EI"
  components:
    # The tile inspector's group of parts a layout can show or hide
    # (Component::Part).
    show: "Show"
    # Beside a part that comes in sizes. The part's name is read out
    # before it, visually hidden.
    size: "Size"
    sizes:
      small: "Small"
      medium: "Medium"
      large: "Large"
      extra_large: "Extra large"
    # One label per part, shared by every layout of the component that
    # draws it.
    parts:
      calendar:
        event_dots: "Event dots"
        tags: "Calendar markers"
        times: "Event times"
        weekday_header: "Weekday initials"
      clock:
        date: "Date"
        time: "Time"
      newspaper:
        bylines: "Feed and time"
        dateline: "Date line"
        events: "Upcoming events"
        photos: "Photos beside the lead"
        summaries: "Summaries"
        weather: "Weather"
      note:
        qr_code: "QR code to edit"
      weather:
        condition: "Condition"
        feels_like: "Feels like"
        high_low: "High and low"
        humidity: "Humidity"
        icon: "Icon"
        precip: "Chance of rain"
        sun: "Sunrise and sunset"
        temperature: "Temperature"
    # Under a part in the inspector, while it can't draw
    # (DashboardItemsHelper#part_hint).
    part_hints:
      note:
        qr_code_html: "Needs the server address, set in %{settings}."
  devices:
    # Beside links to a panel's live frame URL: the builder's device list
    # and the device page.
    live_bitmap_hint: "Opening the live bitmap renders a fresh frame if one is due, and counts as a check-in for the panel."
  # A headline template's fields (news_templates/_fields): in a news tile's
  # inspector, and for new tiles on the Settings page.
  news_templates:
    legend: "Each headline"
    settings_legend: "New news tiles"
    settings_hint: "How a new news tile draws each headline. Existing tiles keep their own."
    image: "Picture"
    placement: "Placement"
    placements:
      none: "None"
      left: "Left of the text"
      right: "Right of the text"
      above: "Above the text"
    line: "Line %{number}"
    shows: "Shows"
    fields:
      none: "Nothing"
      title: "Title"
      summary: "Summary"
      author: "Author"
      source: "Feed name"
      date: "Date"
      age: "Time since"
      custom: "Custom format"
    format: "Format"
    format_placeholder: "{source} · {age}"
    format_hint: "Text and tokens, like {author} · {date}. See the tokens below."
    clamp: "Max lines"
    tokens:
      summary: "Tokens"
      token: "Token"
      draws: "Draws"
      named:
        title: "The headline"
        summary: "The summary or description, as plain text"
        author: "The author"
        source: "The feed's name"
        date: "When it was published: Sep 16"
        age: "How long ago: 5m, 3h, 2d"
      paths_html: "Any other part of a feed item works too, by its path in the feed: <code>{dc:creator}</code>, <code>{category}</code>, <code>{enclosure@length}</code>. A line whose tokens are all empty isn't drawn."
      in_feeds: "Found in these feeds:"
  # A note's phone page (NotesController) and its source form.
  notes:
    body: "Note"
    hint: "Markdown works. Up to %{max} characters."
    save: "Save note"
    saved: "Note saved. Panels showing it pick it up at their next check-in."
    last_edited: "Last edited"
    phone_link: "Phone link"
    phone_link_hint: "Open it on a phone, or write it to an NFC tag. A note tile can also draw it as a QR code."
    needs_server_address_html: "Set the server address in %{settings} so it works from a phone."
    open_phone_page: "Open phone page"
    qr_code_label: "QR code to edit this note"
    settings: "Settings"
    formatting:
      summary: "Formatting help"
      type: "Type"
      result: "To get"
      examples:
        - type: "# Heading"
          result: "a large heading"
        - type: "## Heading"
          result: "a smaller heading"
        - type: "**bold**"
          result: "bold"
        - type: "*emphasis*"
          result: "underlined on the panel"
        - type: "~~done~~"
          result: "struck through"
        - type: "- item"
          result: "a bulleted list"
        - type: "1. item"
          result: "a numbered list"
        - type: "- [ ] to do"
          result: "an empty checkbox"
        - type: "- [x] done"
          result: "a checked box"
        - type: "> quote"
          result: "an indented quote"
        - type: "---"
          result: "a line across"
  # Text drawn on a panel.
  renders:
    # PanelTimeHelper#panel_age: how long ago a headline was published.
    age:
      now: "now"
      minutes: "%{count}m"
      hours: "%{count}h"
      days: "%{count}d"
    # The newspaper tile's front page.
    newspaper:
      upcoming: "Upcoming events"
      # NewsHelper#newspaper_event_when: "Today · 1:00 PM".
      event_when: "%{day} · %{time}"
      today: "Today"
      tomorrow: "Tomorrow"
      all_day: "All day"
      now: "Now"
      edition: "%{time} edition"
      number: "No. %{day}"
      high_low: "H %{high}° · L %{low}°"
    weather:
      humidity: "Humidity %{percent}%"
      # The chance of rain on its own, when the high and low it follows
      # are hidden.
      rain: "Rain %{percent}%"
      sun: "Rise %{rise} · Set %{set}"
  weather:
    units:
      imperial: "Fahrenheit"
      metric: "Celsius"
  date:
    formats:
      # A day further off than tomorrow, on a newspaper's events box.
      panel_weekday: "%A"
  time:
    formats:
      # Times drawn on a panel, one for each of AppSetting's clocks. Read
      # through PanelTimeHelper#panel_time.
      panel_clock_12h: "%-l:%M"
      panel_clock_24h: "%H:%M"
      panel_time_12h: "%-l:%M %p"
      panel_time_24h: "%H:%M"
      panel_hour_12h: "%-l %p"
      panel_hour_24h: "%H:%M"
      # event_time_label cuts the 12-hour meridiem to one letter: "12:00p".
      panel_event_12h: "%-l:%M%P"
      panel_event_24h: "%H:%M"
      # PanelTimeHelper#panel_date, on either clock.
      panel_short_date: "%b %-d"
      # A newspaper's date line, on either clock.
      panel_long_date: "%A, %B %-d, %Y"
