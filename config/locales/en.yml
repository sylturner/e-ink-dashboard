# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  app:
    name: "E Ink Dashboard"
    # Shown in place of the name when the sidebar is narrowed.
    short_name: "EI"
  components:
    # The tile inspector's group of parts a layout can show or hide
    # (Component::Part).
    show: "Show"
    # Beside a part that comes in sizes. The part's name is read out
    # before it, visually hidden.
    size: "Size"
    sizes:
      small: "Small"
      medium: "Medium"
      large: "Large"
    # One label per part, shared by every layout of the component that
    # draws it.
    parts:
      calendar:
        event_dots: "Event dots"
        tags: "Calendar markers"
        times: "Event times"
        weekday_header: "Weekday initials"
      clock:
        date: "Date"
        time: "Time"
      news:
        source: "Feed name"
      weather:
        condition: "Condition"
        feels_like: "Feels like"
        high_low: "High and low"
        humidity: "Humidity"
        icon: "Icon"
        precip: "Chance of rain"
        sun: "Sunrise and sunset"
        temperature: "Temperature"
  devices:
    # Beside links to a panel's live frame URL: the builder's device list
    # and the device page.
    live_bitmap_hint: "Opening the live bitmap renders a fresh frame if one is due, and counts as a check-in for the panel."
  # Text drawn on a panel.
  renders:
    weather:
      humidity: "Humidity %{percent}%"
      # The chance of rain on its own, when the high and low it follows
      # are hidden.
      rain: "Rain %{percent}%"
      sun: "Rise %{rise} · Set %{set}"
  weather:
    units:
      imperial: "Fahrenheit"
      metric: "Celsius"
  time:
    formats:
      # Times drawn on a panel, one for each of AppSetting's clocks. Read
      # through PanelTimeHelper#panel_time.
      panel_clock_12h: "%-l:%M"
      panel_clock_24h: "%H:%M"
      panel_time_12h: "%-l:%M %p"
      panel_time_24h: "%H:%M"
      panel_hour_12h: "%-l %p"
      panel_hour_24h: "%H:%M"
      # event_time_label cuts the 12-hour meridiem to one letter: "12:00p".
      panel_event_12h: "%-l:%M%P"
      panel_event_24h: "%H:%M"
