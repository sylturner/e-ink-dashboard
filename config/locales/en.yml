# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  activerecord:
    attributes:
      app_setting:
        server_url: "Server address"
      checklist_provider:
        items: "Checklist"
      device:
        image_format: "Format"
    errors:
      models:
        app_setting:
          attributes:
            server_url:
              not_an_address: "must be a scheme, host and port, like http://192.168.1.10:3000"
        checklist_provider:
          attributes:
            items:
              too_many: "can have at most %{count} items"
              blank_item: "can't have a blank item"
              long_item: "items can be at most %{count} characters"
        device:
          attributes:
            image_format:
              bmp_size: "can only be BMP at %{size}; use PNG for other sizes"
  activemodel:
    attributes:
      checklist_item:
        text: "Item"
  # The panels' API (app/controllers/api).
  api:
    setup:
      # Shown on a TRMNL's own setup screen before its first frame arrives.
      message: "Claim code %{code}: find it in Devices and choose a dashboard."
  app:
    name: "E Ink Dashboard"
    # Shown in place of the name when the sidebar is narrowed.
    short_name: "EI"
  components:
    # The tile inspector's group of parts a layout can show or hide
    # (Component::Part).
    show: "Show"
    # The inspector's Look group (TileLook), which every component has.
    # A blank choice leaves it to the dashboard's theme.
    look:
      legend: "Look"
      theme: "From the theme"
      font: "Text font"
      header_font: "Header font"
      invert: "White on black"
      border:
        label: "Border"
        none: "None"
        thin: "Thin"
        thick: "Thick"
        double: "Double"
        rounded: "Rounded"
      header:
        label: "Header"
        inverted: "White on black"
        rule: "Underlined"
        plain: "Plain"
      padding:
        label: "Padding"
        none: "None"
        roomy: "Roomy"
        spacious: "Spacious"
      align:
        label: "Alignment"
        left: "Left"
        center: "Center"
        right: "Right"
        middle: "Centered both ways"
      scale:
        label: "Text size"
        small: "Small"
        large: "Large"
    # Under a tile's text: the tokens it can carry (PanelTokensHelper).
    # %{example} is what the token would draw now.
    tokens:
      hint: "Tokens in double braces, like {{CURRENT_TIME}}, are filled in when the panel is drawn."
      summary: "Tokens"
      unset: "nothing until the server address is set"
      names:
        current_time: "The time: %{example}"
        current_date: "The date: %{example}"
        long_date: "The whole date: %{example}"
        weekday: "The day of the week: %{example}"
        month: "The month: %{example}"
        year: "The year: %{example}"
        week_number: "The week of the year, from Monday: %{example}"
        greeting: "Good morning, afternoon or evening: %{example}"
        days_until: "Days until a date (year-month-day): %{example}"
        days_since: "Days since a date: %{example}"
        server_url: "This server's address, from Settings: %{example}"
    # A checklist tile's Done items setting (Component::CHECKLIST_DONE_ITEMS).
    checklist:
      done_items:
        strike: "Struck through"
        bottom: "Struck through, at the bottom"
        hide: "Hidden"
    # A countdown tile's Count in setting (Countdown::UNITS).
    countdown:
      units:
        days: "Days"
        hours: "Days and hours"
    # A rotation tile's Moves on setting (Rotation::PERIODS).
    rotation:
      periods:
        daily: "Every day"
        weekly: "Every week"
    # A QR code tile's Security setting (WifiNetwork::SECURITIES).
    qr_code:
      security:
        WPA: "WPA, WPA2 or WPA3"
        WEP: "WEP"
        nopass: "None (an open network)"
    # Beside a part that comes in sizes. The part's name is read out
    # before it, visually hidden.
    size: "Size"
    sizes:
      small: "Small"
      medium: "Medium"
      large: "Large"
      extra_large: "Extra large"
    # One label per part, shared by every layout of the component that
    # draws it.
    parts:
      calendar:
        event_dots: "Event dots"
        tags: "Calendar markers"
        times: "Event times"
        weekday_header: "Weekday initials"
      checklist:
        checkboxes: "Checkboxes"
        progress: "How many are done"
        qr_code: "QR code to check off"
      clock:
        date: "Date"
        time: "Time"
      countdown:
        label: "What it counts to"
        number: "Number"
        sentence: "Sentence"
      newspaper:
        bylines: "Feed and time"
        dateline: "Date line"
        events: "Upcoming events"
        photos: "Photos beside the lead"
        summaries: "Summaries"
        weather: "Weather"
      note:
        qr_code: "QR code to edit"
      photo:
        caption: "Caption"
      qr_code:
        network: "Network name, written out"
        password: "Password, written out"
        qr_code: "QR code"
        text: "The link or text, written out"
      rotation:
        entry: "Current entry"
        upcoming: "Next entry"
      weather:
        condition: "Condition"
        feels_like: "Feels like"
        high_low: "High and low"
        humidity: "Humidity"
        icon: "Icon"
        precip: "Chance of rain"
        sun: "Sunrise and sunset"
        temperature: "Temperature"
    # Under a part in the inspector, while it can't draw
    # (DashboardItemsHelper#part_hint).
    part_hints:
      qr_code_html: "Needs the server address, set in %{settings}."
  dashboards:
    edit:
      # The builder's preview status, once it draws changes not yet saved.
      preview_draft: "The preview includes changes that aren't saved yet."
  devices:
    # A device setting: the strip drawn along the foot of its frames.
    show_navigation:
      label: "Show the navigation strip"
      hint: "Draws a strip along the bottom naming the dashboard showing, the ones before and after it, and where it is in this panel's list. Useful with a dial or the special function."
    # Beside the device page's link to the panel's last frame.
    bitmap_hint: "Opening the bitmap shows the last frame the panel was sent. It doesn't render a new one or count as a check-in."
    # Under the display fields of a device's settings.
    display_hint: "The panel reports its size when it sets up. BMP only works at %{size}; other sizes need PNG. Only 1-bit frames can be rendered so far."
    # The Devices page banner. The server is the address a panel is
    # pointed at.
    index_description: "Your e-paper panels. A new panel adds itself the first time it connects, then waits here for a dashboard. To add a TRMNL, set its API Server to %{server} in its Wi-Fi setup."
    # Beside links to a panel's live frame URL: the builder's device list
    # and the device page.
    live_bitmap_hint: "Opening the live bitmap renders a fresh frame if one is due, and counts as a check-in for the panel."
  # A headline template's fields (news_templates/_fields): in a news tile's
  # inspector, and for new tiles on the Settings page.
  news_templates:
    legend: "Each headline"
    settings_legend: "New news tiles"
    settings_hint: "How a new news tile draws each headline. Existing tiles keep their own."
    image: "Picture"
    placement: "Placement"
    placements:
      none: "None"
      left: "Left of the text"
      right: "Right of the text"
      above: "Above the text"
    line: "Line %{number}"
    shows: "Shows"
    fields:
      none: "Nothing"
      title: "Title"
      summary: "Summary"
      author: "Author"
      source: "Feed name"
      date: "Date"
      age: "Time since"
      custom: "Custom format"
    format: "Format"
    format_placeholder: "{source} · {age}"
    format_hint: "Text and tokens, like {author} · {date}. See the tokens below."
    clamp: "Max lines"
    tokens:
      summary: "Tokens"
      token: "Token"
      draws: "Draws"
      named:
        title: "The headline"
        summary: "The summary or description, as plain text"
        author: "The author"
        source: "The feed's name"
        date: "When it was published: Sep 16"
        age: "How long ago: 5m, 3h, 2d"
      paths_html: "Any other part of a feed item works too, by its path in the feed: <code>{dc:creator}</code>, <code>{category}</code>, <code>{enclosure@length}</code>. A line whose tokens are all empty isn't drawn."
      in_feeds: "Found in these feeds:"
  # A note's phone page (NotesController) and its source form.
  # The Markdown editor (application/_markdown_editor): a toolbar that
  # types the Markdown, and images uploaded as they're added. %{name} is
  # the image's file name.
  # A photo tile's photo in the inspector (dashboard_items/_image_field).
  # The upload messages are the Markdown editor's.
  image_field:
    hint: "A JPEG, PNG, WebP or other picture, up to %{max}. It's uploaded as soon as it's chosen and drawn in black and white."
    preview: "The tile's photo"
    uploaded: "Uploaded %{name}."
    remove: "Remove photo"
    removed: "Photo removed."
  markdown_editor:
    toolbar: "Formatting"
    shortcut: "%{label} (Ctrl+%{key} or ⌘%{key})"
    hint: "Markdown. Paste, drop or choose an image to add it."
    uploading: "Uploading %{name}…"
    uploaded: "Added %{name}."
    failed: "Couldn't upload %{name}. Try again."
    not_image: "%{name} isn't an image."
    too_big: "%{name} is larger than %{max}."
    font: "Font"
    size: "Size"
    sizes:
      small: "Small"
      medium: "Medium"
      large: "Large"
      huge: "Huge"
    buttons:
      heading: "Heading"
      bold: "Bold"
      italic: "Italic"
      strike: "Strikethrough"
      quote: "Quote"
      code: "Code"
      link: "Link"
      bullet: "Bulleted list"
      numbered: "Numbered list"
      task: "Task list"
      image: "Add an image"
  notes:
    body: "Note"
    hint: "Up to %{max} characters."
    save: "Save note"
    saved: "Note saved. Panels showing it pick it up at their next check-in."
    last_edited: "Last edited"
    formatting:
      summary: "Formatting help"
      type: "Type"
      result: "To get"
      examples:
        - type: "# Heading"
          result: "a large heading"
        - type: "## Heading"
          result: "a smaller heading"
        - type: "**bold**"
          result: "bold"
        - type: "*emphasis*"
          result: "underlined on the panel"
        - type: "~~done~~"
          result: "struck through"
        - type: "- item"
          result: "a bulleted list"
        - type: "1. item"
          result: "a numbered list"
        - type: "- [ ] to do"
          result: "an empty checkbox"
        - type: "- [x] done"
          result: "a checked box"
        - type: "> quote"
          result: "an indented quote"
        - type: "---"
          result: "a line across"
        - type: "{font:jersey}Hello{/font}"
          result: "Hello in the Jersey font (the Font menu lists them)"
        - type: "{size:large}Hello{/size}"
          result: "Hello larger: small, medium, large or huge"
  # A checklist's phone page (ChecklistsController).
  checklists:
    items: "Items"
    saved_as_changed: "Each change to the items is saved as you make it."
    progress: "%{done} of %{count} done."
    resets:
      never: ""
      daily: "Starts over each day."
      weekly: "Starts over each week."
    empty: "Nothing on the list yet."
    move_up: "Move “%{text}” up"
    move_down: "Move “%{text}” down"
    remove: "Remove “%{text}”"
    add_label: "Add an item"
    add: "Add"
    add_hint: "Up to %{max} items."
    added: "Added “%{text}”."
    removed: "Removed “%{text}”."
    clear_done: "Clear done items"
    cleared:
      zero: "Nothing was done yet."
      one: "Cleared 1 done item."
      other: "Cleared %{count} done items."
    last_edited: "Last edited"
    # The source form (sources/providers/_checklist_provider).
    reset: "Start over"
    reset_hint: "Unchecks everything at the start of each day or week, for a routine or a chore list."
    reset_options:
      never: "Never"
      daily: "Each day"
      weekly: "Each week"
    new_items: "Add items"
    new_items_hint: "One per line."
  # What a note and a checklist share: a page to edit it from a phone, and
  # a QR code of it on its tile (PhonePageHelper).
  phone_pages:
    link: "Phone link"
    link_hint:
      note_provider: "Open it on a phone, or write it to an NFC tag. A note tile can also draw it as a QR code."
      checklist_provider: "Check items off on a phone, or write the link to an NFC tag. A checklist tile can also draw it as a QR code."
    needs_server_address_html: "Set the server address in %{settings} so it works from a phone."
    open: "Open phone page"
    settings: "Settings"
    qr_code_label:
      note_provider: "QR code to edit this note"
      checklist_provider: "QR code to check off this list"
  # Text drawn on a panel.
  renders:
    # The builder's preview of changes that couldn't be saved.
    invalid:
      heading: "These changes can't be saved"
    # What PanelTokensHelper fills a token with, where it's words.
    # A checklist tile.
    checklist:
      progress: "%{done} of %{count} done"
      empty: "Nothing on the list"
      all_done: "All done"
    # A countdown tile (Countdown). The big number's words go under it.
    countdown:
      no_date: "No date set"
      today: "Today!"
      days:
        one: "%{count} day"
        other: "%{count} days"
      hours:
        one: "%{count} hour"
        other: "%{count} hours"
      minutes:
        one: "%{count} minute"
        other: "%{count} minutes"
      # Joins days and hours: "3 days and 4 hours".
      and: "%{first} and %{second}"
      unit:
        days:
          one: "day"
          other: "days"
        hours:
          one: "hour"
          other: "hours"
        minutes:
          one: "minute"
          other: "minutes"
      until: "until %{label}"
      to_go: "to go"
      ago: "ago"
      since: "since %{label}"
      sentence:
        until: "%{time} until %{label}"
        to_go: "%{time} to go"
        today: "%{label} is today!"
        since: "%{label} was %{time} ago"
        ago: "%{time} ago"
    # A rotation tile.
    rotation:
      empty: "No entries yet"
      upcoming: "Next: %{entry}"
      # The whole list's current entry, for a screen reader of the preview.
      current: "now"
    # A QR code tile.
    qr_code:
      empty: "Nothing to encode yet"
      too_long: "Too long for a QR code"
      network: "Network: %{name}"
      password: "Password: %{password}"
      label:
        wifi: "QR code to join %{name}"
        link: "QR code"
    # A photo tile with no photo to draw.
    photo:
      missing: "No photo"
    tokens:
      greeting:
        morning: "Good morning"
        afternoon: "Good afternoon"
        evening: "Good evening"
    # PanelTimeHelper#panel_age: how long ago a headline was published.
    age:
      now: "now"
      minutes: "%{count}m"
      hours: "%{count}h"
      days: "%{count}d"
    # The newspaper tile's front page.
    newspaper:
      # Each type of paper's own words (NewspaperStyle): the motto when the
      # tile has none, the events box's heading, and the label over the
      # lead for a style with a kicker.
      styles:
        broadsheet:
          motto: "All the news that fits"
          events: "Upcoming events"
        tabloid:
          motto: "Shocking but true!"
          events: "What's on"
          kicker: "Exclusive!"
        zine:
          motto: "Photocopied with love"
          events: "Be there or be square"
        patriot:
          motto: "Land of the free, home of the headlines"
          events: "Mark your calendar"
          kicker: "Breaking news"
        hacker:
          motto: "All your news are belong to us"
          events: "crontab -l"
          kicker: "Access granted"
        wizard:
          motto: "Mischief, marvels and the morning news"
          events: "Coming to a cauldron near you"
          kicker: "Special edition"
        mac:
          motto: "Welcome to Macintosh"
          events: "Calendar"
        windows:
          motto: "Program Manager"
          events: "Calendar"
        cde:
          motto: "Common Desktop Environment"
          events: "Calendar"
          # The Front Panel's workspace switcher, the first one current.
          workspaces: [ "One", "Two", "Three", "Four" ]
        custom:
          motto: "All the news that fits"
          events: "Upcoming events"
      # NewsHelper#newspaper_event_when: "Today · 1:00 PM".
      event_when: "%{day} · %{time}"
      today: "Today"
      tomorrow: "Tomorrow"
      all_day: "All day"
      now: "Now"
      edition: "%{time} edition"
      number: "No. %{day}"
      high_low: "H %{high}° · L %{low}°"
    weather:
      humidity: "Humidity %{percent}%"
      # The chance of rain on its own, when the high and low it follows
      # are hidden.
      rain: "Rain %{percent}%"
      sun: "Rise %{rise} · Set %{set}"
  weather:
    units:
      imperial: "Fahrenheit"
      metric: "Celsius"
  date:
    formats:
      # A day further off than tomorrow, on a newspaper's events box.
      panel_weekday: "%A"
      # The {{MONTH}} token (PanelTokensHelper).
      panel_month: "%B"
  time:
    formats:
      # Times drawn on a panel, one for each of AppSetting's clocks. Read
      # through PanelTimeHelper#panel_time.
      panel_clock_12h: "%-l:%M"
      panel_clock_24h: "%H:%M"
      panel_time_12h: "%-l:%M %p"
      panel_time_24h: "%H:%M"
      panel_hour_12h: "%-l %p"
      panel_hour_24h: "%H:%M"
      # event_time_label cuts the 12-hour meridiem to one letter: "12:00p".
      panel_event_12h: "%-l:%M%P"
      panel_event_24h: "%H:%M"
      # PanelTimeHelper#panel_date, on either clock.
      panel_short_date: "%b %-d"
      # A newspaper's date line, on either clock.
      panel_long_date: "%A, %B %-d, %Y"
