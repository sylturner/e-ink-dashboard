# The app's one settings row. UTC, a 12-hour clock and Sunday weeks keep
# the rest of the suite on the behavior it was written against.
one:
  time_zone: Etc/UTC
  units: imperial
  clock: 12h
  week_start: sunday
  refresh_seconds: 900
  night_refresh_seconds: 3600
  active_from_hour: 6
  active_until_hour: 23
